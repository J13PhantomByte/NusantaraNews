<!doctype html>
<html lang="id" data-bs-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Artikel — NusantaraNews</title>
  <meta name="description" content="Baca artikel lengkap di NusantaraNews — portal berita modern yang cepat dan terpercaya.">
  <link rel="canonical" href="https://www.nusantara-news.example/article.html">
  <meta property="og:type" content="article">
  <meta property="og:title" content="Artikel — NusantaraNews">
  <meta property="og:description" content="Baca artikel lengkap di NusantaraNews.">
  <meta property="og:image" content="https://picsum.photos/seed/nusantaranews-og/1200/630">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="theme-color" content="#0d6efd">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%230d6efd'/%3E%3Ctext x='16' y='22' font-size='18' font-family='Arial' font-weight='bold' fill='white' text-anchor='middle'%3EN%3C/text%3E%3C/svg%3E">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="css/style.css" rel="stylesheet">
  <link href="css/responsive.css" rel="stylesheet">
</head>
<body>
  <a class="visually-hidden-focusable btn btn-brand m-2" href="#articleMain">Lewati ke artikel</a>
  <div id="readingProgress" aria-hidden="true"></div>

  <header>
    <nav class="navbar navbar-expand-lg site-navbar sticky-top" aria-label="Navigasi utama">
      <div class="container">
        <a class="navbar-brand d-flex align-items-center gap-2" href="index.html">
          <span class="brand-mark" aria-hidden="true">N</span>
          <span class="brand-name">Nusantara<span>News</span></span>
        </a>
        <div class="d-flex align-items-center gap-2 ms-auto">
          <a class="icon-btn text-decoration-none" href="index.html" aria-label="Kembali ke beranda"><i class="bi bi-house" aria-hidden="true"></i></a>
          <button class="icon-btn" id="themeToggle" aria-label="Aktifkan mode gelap"><i class="bi bi-moon-stars" aria-hidden="true"></i></button>
        </div>
      </div>
    </nav>
  </header>

  <main class="container mt-3" id="articleMain">
    <nav aria-label="Breadcrumb">
      <ol class="breadcrumb small" id="crumb">
        <li class="breadcrumb-item"><a href="index.html">Home</a></li>
        <li class="breadcrumb-item" id="crumbCat">Kategori</li>
        <li class="breadcrumb-item active" aria-current="page" id="crumbTitle">Artikel</li>
      </ol>
    </nav>

    <div id="articleError" class="alert alert-warning d-none" role="alert">
      Artikel tidak ditemukan atau URL tidak valid. <a href="index.html" class="alert-link">Kembali ke beranda</a>.
    </div>

    <article id="articleWrap" aria-labelledby="artTitle">
      <header>
        <div id="artCat" class="mb-2"></div>
        <h1 id="artTitle" class="fw-bold" style="letter-spacing:-.02em"></h1>
        <p id="artSub" class="lead text-muted"></p>
        <div class="d-flex flex-wrap align-items-center gap-2 border-top border-bottom py-2 my-3" style="border-color:var(--border)!important">
          <span class="d-inline-flex align-items-center gap-2">
            <span class="brand-mark" style="width:38px;height:38px" id="authorInitial" aria-hidden="true">N</span>
            <span><strong id="artAuthor" class="d-block" style="font-size:.9rem"></strong><small class="text-muted" id="artRole"></small></span>
          </span>
          <span class="ms-auto small text-muted" id="artMeta"></span>
        </div>
        <div class="d-flex flex-wrap gap-2 mb-3" aria-label="Aksi artikel">
          <button class="btn btn-outline-primary btn-sm" id="shareBtn"><i class="bi bi-share me-1"></i>Bagikan</button>
          <button class="btn btn-outline-secondary btn-sm" id="bookmarkBtn"><i class="bi bi-bookmark me-1"></i>Simpan</button>
          <a class="btn btn-outline-secondary btn-sm" href="index.html"><i class="bi bi-arrow-left me-1"></i>Semua Berita</a>
        </div>
      </header>
      <figure class="article-hero">
        <img id="artImg" class="img-fluid w-100" alt="" width="1200" height="675" fetchpriority="high" decoding="async">
        <figcaption id="artCaption" class="mt-1"></figcaption>
      </figure>
      <section class="article-body mt-3" id="artBody" aria-label="Isi artikel"></section>
      <footer class="mt-4">
        <div id="artTags" class="d-flex flex-wrap gap-2" aria-label="Tag"></div>
      </footer>
    </article>

    <section class="mt-5" aria-labelledby="relTitle">
      <div class="sec-head"><span class="bar" aria-hidden="true"></span><h2 id="relTitle">Berita Terkait</h2></div>
      <div class="row g-3" id="relatedGrid"></div>
    </section>
  </main>

  <footer class="site-footer mt-5 pt-4 pb-3">
    <div class="container d-flex flex-column flex-md-row justify-content-between gap-2 small">
      <span>© 2026 NusantaraNews — demo frontend.</span>
      <span><a href="#">Privacy Policy</a> • <a href="#">Terms of Service</a></span>
    </div>
  </footer>

  <button id="backToTop" aria-label="Kembali ke atas"><i class="bi bi-arrow-up" aria-hidden="true"></i></button>
  <div class="toast-container position-fixed bottom-0 end-0 p-3" aria-live="polite">
    <div id="appToast" class="toast" role="status" aria-live="polite">
      <div class="toast-header"><strong class="me-auto" id="toastTitle">Info</strong><button type="button" class="btn-close" data-bs-dismiss="toast" aria-label="Tutup notifikasi"></button></div>
      <div class="toast-body" id="toastMsg">…</div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous" defer></script>
  <script src="js/data.js" defer></script>
  <script src="js/app.js" defer></script>
  <script src="js/article.js" defer></script>
  <script type="application/ld+json" id="schemaArticle"></script>
</body>
</html>
